[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "query-engine"
version = "0.1.0"
description = "Dependency-free structured query DSL engine for JSON-like documents"
readme = "readme.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "F.Kurokawa" }]
dependencies = []

[project.optional-dependencies]
test = []
docs = [
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.3",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
